name: Lint

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    uses: harryzcy/github-actions/.github/workflows/linter.yml@5eaf925875721488eed093142fde35b53b8e6865 # main

  spelling:
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@5eaf925875721488eed093142fde35b53b8e6865 # main
